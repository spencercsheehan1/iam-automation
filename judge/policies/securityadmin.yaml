# Jury: the eligibility policy for SECURITYADMIN.
#
# A named-holder policy: only the users listed under `allowed_users` may
# hold `role`. Decided by Snowflake user name (case-insensitive), with no
# HR lookup. Built-in Snowflake role, so Terraform does not manage it.

version: "1.0"
role: SECURITYADMIN

allowed_users:
  - JUDGE_SERVICE
  - TERRAFORM_SERVICE
